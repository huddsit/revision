<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>Revision</title>
<style>
  :root {
    --bg: #14213d; --card: #1e2f55; --ink: #f4f6fb; --muted: #a9b4cc;
    --accent: #fca311; --good: #2bb673; --bad: #e5484d; --line: #2c3f6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100dvh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 1.45rem; margin: 6px 0 2px; }
  h2 { font-size: 1.05rem; margin: 22px 0 8px; color: var(--muted); font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin: 10px 0; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .btn { display: block; width: 100%; padding: 16px; border-radius: 14px; font-weight: 700;
    font-size: 1.1rem; margin: 10px 0; background: var(--card); text-align: center; }
  .btn.primary { background: var(--accent); color: #14213d; }
  .btn small { display: block; font-weight: 500; font-size: .85rem; opacity: .8; margin-top: 2px; }
  .btn:disabled { opacity: .4; }
  .link { background: none; color: var(--muted); text-decoration: underline; padding: 8px; font-size: .9rem; }
  .stats { display: flex; gap: 10px; }
  .stat { flex: 1; background: var(--card); border-radius: 14px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 1.6rem; }
  .stat span { color: var(--muted); font-size: .8rem; }
  .topic { display: block; width: 100%; text-align: left; background: none; padding: 7px 0; }
  .topic .row { display: flex; justify-content: space-between; font-size: .92rem; }
  .topic .row span:last-child { color: var(--muted); }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; border-radius: 4px; }
  input { font: inherit; width: 100%; padding: 14px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--card); color: var(--ink); }

  /* quiz */
  .qtop { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .9rem; }
  .streak { color: var(--accent); font-weight: 700; }
  .timer { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 10px 0 18px; }
  .timer i { display: block; height: 100%; background: var(--accent); width: 100%; }
  .topiclabel { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
  .question { font-size: 1.3rem; font-weight: 700; margin: 6px 0 18px; min-height: 3.5em; }
  .ans { display: block; width: 100%; text-align: left; padding: 16px; margin: 10px 0; border-radius: 14px;
    background: var(--card); font-size: 1.05rem; border: 2px solid transparent; }
  .ans.good { background: var(--good); }
  .ans.bad { background: var(--bad); }
  .ans.reveal { border-color: var(--good); }
  .tf { display: flex; gap: 10px; } .tf .ans { text-align: center; font-weight: 700; }
  .feedback { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--card); color: var(--muted); }
  .feedback b { color: var(--ink); }
  .tapnext { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 14px; }
  .missed { font-size: .95rem; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .missed:last-child { border: 0; }
  .missed .right { color: var(--good); }
  .fig { background: #fff; border-radius: 14px; padding: 8px; margin: 0 0 12px; }
  .fig svg { display: block; width: 100%; height: auto; max-height: 36vh; }
  .fig.small svg { max-height: 26vh; }
  .fig.study svg { max-height: none; }
  .question.withfig { min-height: 0; font-size: 1.15rem; margin-bottom: 8px; }
  .grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid4 .ans { margin: 0; text-align: center; font-weight: 800; font-size: 1.3rem; padding: 14px; }
  .studyname { font-weight: 700; margin: 18px 0 6px; }
  .big { font-size: 3rem; font-weight: 800; text-align: center; margin: 10px 0 0; }
  .center { text-align: center; }
</style>
</head>
<body>
<div class="wrap" id="app">Loading…</div>
<script>
"use strict";
// ---------- settings ----------
const ROUND_SIZE = 20;
const TIME_MC = 15000, TIME_TF = 8000, TIME_IMG = 20000;   // ms allowed per question
const SALT = "rev-7c1e";                 // only deters casual editing of shared scores

// ---------- helpers ----------
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (n, d) => d ? Math.round(100 * n / d) : 0;
const colourFor = p => p >= 80 ? "var(--good)" : p >= 40 ? "var(--accent)" : "var(--bad)";
function hash(str) { let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36).toUpperCase().slice(-5); }

const params = new URLSearchParams(location.search);
const testId = params.get("t");
let test, state, round;

const storeKey = () => "rev." + testId;
function load() {
  let s; try { s = JSON.parse(localStorage.getItem(storeKey())); } catch {}
  s = s || { q: {}, rounds: [] };
  for (const v of Object.values(s.q)) if (v.ok === undefined) v.ok = v.b > 0;   // older progress format
  return s;
}
function save() { localStorage.setItem(storeKey(), JSON.stringify(state)); }
// per question: s = times asked, c = correct, w = wrong, ok = last answer was correct
const qs = id => state.q[id] || (state.q[id] = { s: 0, c: 0, w: 0, ok: false });
const getName = () => localStorage.getItem("rev.name") || "";
const isOk = q => !!state.q[q.id]?.ok;
const isWrong = q => !!state.q[q.id]?.s && !state.q[q.id].ok;

function progress(filterTopic) {
  const list = test.questions.filter(q => !filterTopic || q.t === filterTopic);
  const done = list.filter(isOk).length, wrong = list.filter(isWrong).length;
  return { total: list.length, done, wrong, unseen: list.length - done - wrong, p: pct(done, list.length) };
}
const allDone = () => test.questions.every(isOk);
// finishing word: stored lightly scrambled so it isn't readable in the test file
function finishWord() {
  if (!test.finish) return null;
  const k = "rev:" + test.id, b = atob(test.finish);
  let s = ""; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b.charCodeAt(i) ^ k.charCodeAt(i % k.length));
  return s;
}

// ---------- diagrams ----------
// test.diagrams: { svgName: { t, title, parts: {partId: "Name"}, name?, find?, modes? } }
//   -> per part: "name" question (pointer + "?"), "find" question (letters A-D on parts)
// test.galleries: [{ t, q, items: { svgName: "Answer" } }] -> "what is this picture?" questions
// Any question may also carry img (+ mark) directly.
const SVG = {};
const lowerFirst = s => /^[A-Z][a-z]/.test(s) ? s[0].toLowerCase() + s.slice(1) : s;
function buildDiagramQuestions() {
  for (const [img, d] of Object.entries(test.diagrams || {})) {
    const ids = Object.keys(d.parts), modes = d.modes || ["name", "find"];
    for (const p of ids) {
      const name = d.parts[p];
      const others = shuffle(ids.filter(x => x !== p)).slice(0, 3).map(x => d.parts[x]);
      if (modes.includes("name")) test.questions.push({ id: `d.${img}.${p}`, t: d.t, img, mark: p,
        q: d.name || "What is the part labelled ? called?", a: [name, ...others] });
      if (modes.includes("find") && ids.length >= 3) test.questions.push({ id: `f.${img}.${p}`, t: d.t, img, find: p, pool: ids,
        q: (d.find || "Which label points to the {p}?").replace("{p}", lowerFirst(name)), a: [name] });
    }
  }
  (test.galleries || []).forEach((g, gi) => {
    const items = Object.entries(g.items);
    for (const [img, label] of items) {
      const others = shuffle(items.filter(([i]) => i !== img).map(([, l]) => l)).slice(0, 3);
      test.questions.push({ id: `g${gi}.${img}`, t: g.t, img, q: g.q, a: [label, ...others] });
    }
  });
}
async function loadSvgs() {
  const names = new Set([...test.questions.map(q => q.img), ...Object.keys(test.diagrams || {})].filter(Boolean));
  await Promise.all([...names].map(async n => {
    try { SVG[n] = await (await fetch("diagrams/" + n + ".svg")).text(); } catch { SVG[n] = ""; }
  }));
}
const NS = "http://www.w3.org/2000/svg";
function el(svg, tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  svg.appendChild(e); return e;
}
// marks: { partId: "?" | "A" | "1" ... }
function figure(img, marks = {}, cls = "") {
  const div = document.createElement("div");
  div.className = "fig " + cls;
  div.innerHTML = SVG[img] || "";
  const svg = div.querySelector("svg");
  if (!svg) return div;
  for (const [part, text] of Object.entries(marks)) {
    const a = svg.querySelector(`[data-part="${part}"]`);
    if (!a) continue;
    const [cx, cy, lx, ly] = ["cx", "cy", "data-lx", "data-ly"].map(k => a.getAttribute(k));
    el(svg, "line", { x1: lx, y1: ly, x2: cx, y2: cy, stroke: "#fff", "stroke-width": 6, "stroke-linecap": "round" });
    el(svg, "line", { x1: lx, y1: ly, x2: cx, y2: cy, stroke: "#e8590c", "stroke-width": 2.5 });
    el(svg, "circle", { cx, cy, r: 4.5, fill: "#e8590c", stroke: "#fff", "stroke-width": 1.5 });
    el(svg, "circle", { cx: lx, cy: ly, r: 16, fill: "#fca311", stroke: "#14213d", "stroke-width": 2, "data-bubble": text });
    el(svg, "text", { x: lx, y: +ly + 6.5, "text-anchor": "middle", "font-size": 18, "font-weight": 800, fill: "#14213d" }, text);
  }
  return div;
}

// ---------- start ----------
async function start() {
  if (!testId) return listTests();
  try {
    const r = await fetch("tests/" + encodeURIComponent(testId) + ".json", { cache: "no-cache" });
    if (!r.ok) throw 0;
    test = await r.json();
  } catch { $app.innerHTML = `<h1>Test not found</h1><p class="sub">Check the link.</p>`; return; }
  document.title = test.title;
  buildDiagramQuestions();
  await loadSvgs();
  state = load();
  getName() ? home() : askName();
}

async function listTests() {
  let tests = [];
  try { tests = await (await fetch("tests/index.json", { cache: "no-cache" })).json(); } catch {}
  $app.innerHTML = `<h1>Revision</h1><p class="sub">Pick a test</p>` +
    tests.map(t => `<a class="btn" style="text-decoration:none" href="?t=${encodeURIComponent(t.id)}">${esc(t.title)}</a>`).join("");
}

function askName() {
  $app.innerHTML = `<h1>${esc(test.title)}</h1><p class="sub">What's your name?</p>
    <input id="nm" autocomplete="given-name" maxlength="20" placeholder="Your name">
    <button class="btn primary" id="go">Start</button>`;
  const nm = document.getElementById("nm"); nm.focus();
  const go = () => { const v = nm.value.trim(); if (!v) return; localStorage.setItem("rev.name", v); home(); };
  document.getElementById("go").onclick = go;
  nm.onkeydown = e => { if (e.key === "Enter") go(); };
}

// ---------- home ----------
function home() {
  const m = progress();
  const left = m.total - m.done;
  const topics = Object.entries(test.topics).map(([k, label]) => {
    const t = progress(k);
    return `<div class="topic">
      <div class="row"><span>${esc(label)}</span><span>${t.done}/${t.total}${t.wrong ? " · " + t.wrong + " to fix" : ""}</span></div>
      <div class="bar"><i style="width:${t.p}%;background:${colourFor(t.p)}"></i></div></div>`;
  }).join("");

  $app.innerHTML = `
    <h1>${esc(test.title)}</h1>
    <p class="sub">Hi ${esc(getName())} · ${m.total} questions</p>
    ${state.finished ? wordCard() : ""}
    <div class="stats">
      <div class="stat"><b>${m.done}/${m.total}</b><span>got right</span></div>
      <div class="stat"><b>${m.wrong}</b><span>to fix</span></div>
      <div class="stat"><b>${m.unseen}</b><span>not tried</span></div>
    </div>
    <button class="btn primary" id="go">▶ ${state.finished ? "Practise" : m.done || m.wrong ? "Next" : "Start"} · ${Math.min(ROUND_SIZE, m.total)} questions
      <small>${left ? `${left} still to get right` : "All done!"}</small></button>
    ${test.diagrams ? `<button class="btn" id="study">📖 Study the diagrams<small>Every diagram, fully labelled</small></button>` : ""}
    <h2>Topics</h2>
    <div class="card">${topics}</div>
    <p class="center"><button class="link" id="share">Send my progress</button>
      <button class="link" id="who">Not ${esc(getName())}?</button>
      <button class="link" id="reset">Reset progress</button></p>`;

  document.getElementById("go").onclick = begin;
  if (test.diagrams) document.getElementById("study").onclick = study;
  document.getElementById("share").onclick = () => share(null);
  document.getElementById("who").onclick = askName;
  document.getElementById("reset").onclick = e => {
    if (e.target.dataset.armed) { state = { q: {}, rounds: [] }; save(); home(); }
    else { e.target.dataset.armed = 1; e.target.textContent = "Tap again to wipe all progress"; }
  };
}

// ---------- study page ----------
function study() {
  $app.innerHTML = `<h1>Diagrams</h1><p class="sub">Cover the key and try to name each number.</p><div id="list"></div>
    <button class="btn primary" id="back">Back</button>`;
  const list = document.getElementById("list");
  for (const [img, d] of Object.entries(test.diagrams)) {
    const parts = Object.entries(d.parts), marks = {};
    parts.forEach(([p], i) => marks[p] = String(i + 1));
    const h = document.createElement("div"); h.className = "studyname"; h.textContent = d.title || test.topics[d.t];
    const key = document.createElement("div"); key.className = "card";
    key.innerHTML = parts.map(([, n], i) => `<b>${i + 1}</b> ${esc(n)}`).join("<br>");
    list.append(h, figure(img, marks, "study"), key);
  }
  (test.galleries || []).forEach(g => {
    const h = document.createElement("div"); h.className = "studyname"; h.textContent = g.q;
    list.append(h);
    for (const [img, label] of Object.entries(g.items)) {
      const cap = document.createElement("p"); cap.className = "sub"; cap.style.margin = "-6px 0 14px"; cap.textContent = label;
      list.append(figure(img, {}, "small"), cap);
    }
  });
  document.getElementById("back").onclick = home;
  window.scrollTo(0, 0);
}

// ---------- choosing questions ----------
// Only questions not yet answered correctly, unless there aren't enough of them.
// Up to half the round is previous mistakes, the rest new questions.
// Two questions about the same diagram part never share a round if it can be avoided (one would give the other away).
function pick() {
  const all = shuffle(test.questions);
  const wrong = all.filter(isWrong), unseen = all.filter(q => !state.q[q.id]?.s), done = all.filter(isOk);
  const half = Math.ceil(ROUND_SIZE / 2);
  const groups = [[...wrong.slice(0, half), ...unseen, ...wrong.slice(half)], done];
  const chosen = [], parts = new Set();
  const partKey = q => q.img && (q.mark || q.find) ? q.img + ":" + (q.mark || q.find) : null;
  for (const group of groups)
    for (const strict of [true, false])
      for (const q of group) {
        if (chosen.length >= ROUND_SIZE) break;
        if (chosen.includes(q) || (strict && parts.has(partKey(q)))) continue;
        chosen.push(q); if (partKey(q)) parts.add(partKey(q));
      }
  return shuffle(chosen);
}

// ---------- quiz ----------
function begin() {
  round = { queue: pick(), i: 0, score: 0, streak: 0, best: 0, right: 0, answered: 0,
            missed: [], times: [], before: progress().done };
  ask();
}

let timerRaf, deadline, locked;
function ask() {
  const r = round;
  if (r.i >= r.queue.length) return finish();
  const q = r.queue[r.i];
  const limit = q.tf ? TIME_TF : q.img ? TIME_IMG : TIME_MC;
  let answers, correct, shown, marks = {};
  if (q.find) {          // letters on up to 4 parts; answer is a letter
    const parts = shuffle([q.find, ...shuffle(q.pool.filter(p => p !== q.find)).slice(0, 3)]);
    parts.forEach((p, i) => marks[p] = "ABCD"[i]);
    answers = parts.map((p, i) => "ABCD"[i]);
    correct = marks[q.find]; shown = `${correct} (${q.a[0]})`;
  } else {
    if (q.mark) marks[q.mark] = "?";
    answers = q.tf ? ["True", "False"] : shuffle(q.a);
    correct = shown = q.a[0];
  }
  locked = false;

  $app.innerHTML = `
    <div class="qtop"><span>${r.i + 1} / ${r.queue.length}</span>
      <span class="streak">${r.streak >= 3 ? "🔥 " + r.streak : ""}</span><span>${r.score} pts</span></div>
    <div class="timer"><i id="tm"></i></div>
    <div class="topiclabel">${esc(test.topics[q.t] || "")}</div>
    ${q.img ? `<div id="figslot"></div>` : ""}
    <div class="question ${q.img ? "withfig" : ""}">${esc(q.q)}</div>
    <div class="${q.tf ? "tf" : q.find ? "grid4" : ""}" id="answers">
      ${answers.map(a => `<button class="ans" data-a="${esc(a)}">${esc(a)}</button>`).join("")}
    </div><div id="fb"></div>`;
  if (q.img) document.getElementById("figslot").replaceWith(figure(q.img, marks));

  const started = performance.now();
  deadline = started + limit;
  const tm = document.getElementById("tm");
  cancelAnimationFrame(timerRaf);
  const tick = () => {
    const left = deadline - performance.now();
    tm.style.width = Math.max(0, 100 * left / limit) + "%";
    if (left <= 0) return answer(q, null, correct, limit, limit, shown);
    timerRaf = requestAnimationFrame(tick);
  };
  timerRaf = requestAnimationFrame(tick);

  document.querySelectorAll(".ans").forEach(b => b.onclick = () =>
    answer(q, b.dataset.a, correct, performance.now() - started, limit, shown));
}

function answer(q, chosen, correct, ms, limit, shown) {
  if (locked) return; locked = true;
  cancelAnimationFrame(timerRaf);
  const r = round, s = qs(q.id), ok = chosen === correct;
  s.s++; r.answered++; r.times.push(ms);
  document.querySelectorAll(".ans").forEach(b => {
    if (b.dataset.a === chosen) b.classList.add(ok ? "good" : "bad");
    else if (b.dataset.a === correct && !ok) b.classList.add("reveal");
  });

  if (ok) {
    s.c++; s.ok = true;
    r.right++; r.streak++; r.best = Math.max(r.best, r.streak);
    r.score += 10 + Math.round(10 * Math.max(0, 1 - ms / limit));   // speed bonus
    save();
    r.i++; setTimeout(ask, 450);
    return;
  }
  s.w++; s.ok = false; r.streak = 0; save();
  if (navigator.vibrate) navigator.vibrate(120);
  r.missed.push(q);
  const bubble = document.querySelector(`[data-bubble="${correct}"]`);
  if (q.find && bubble) bubble.setAttribute("fill", "#2bb673");
  document.getElementById("fb").innerHTML = `<div class="feedback">${chosen === null ? "<b>Out of time.</b> " : ""}
    Answer: <b>${esc(shown)}</b>${q.x ? "<br>" + esc(q.x) : ""}</div><div class="tapnext">Tap anywhere to carry on</div>`;
  const next = () => { document.removeEventListener("click", next, true); r.i++; ask(); };
  setTimeout(() => document.addEventListener("click", next, true), 300);
}

// ---------- results ----------
function finish() {
  const r = round;
  const acc = pct(r.right, r.answered);
  const avg = r.times.length ? (r.times.reduce((a, b) => a + b, 0) / r.times.length / 1000).toFixed(1) : 0;
  state.rounds.push({ d: Date.now(), right: r.right, n: r.answered, score: r.score });
  // every question now answered correctly (which also means this round was 100%)
  const justFinished = !state.finished && allDone() && r.right === r.answered;
  if (justFinished) state.finished = Date.now();
  save();
  const m = progress(), left = m.total - m.done;
  const verdict = justFinished ? "You've got every question right." : acc === 100 ? "Perfect round." : acc >= 80 ? "Good going." : acc >= 50 ? "Getting there." : "Plenty to work on, which is what this is for.";

  $app.innerHTML = `
    <h1>${justFinished ? "Finished!" : "Round done"}</h1><p class="sub">${verdict}</p>
    ${justFinished ? wordCard() : ""}
    <div class="big">${r.right}/${r.answered}</div>
    <p class="center sub">${acc}% · ${r.score} pts · best streak ${r.best} · ${avg}s per question</p>
    <div class="stats">
      <div class="stat"><b>${m.done}/${m.total}</b><span>got right overall</span></div>
      <div class="stat"><b>${left}</b><span>still to get right</span></div>
    </div>
    ${left ? `<button class="btn primary" id="again">▶ Next ${Math.min(ROUND_SIZE, m.total)} questions</button>` : ""}
    <button class="btn" id="share">📤 Send result on WhatsApp</button>
    <button class="btn" id="home">Home</button>
    ${r.missed.length ? `<h2>Got wrong this round</h2><div class="card">` + r.missed.map((q, i) =>
      `<div class="missed">${q.img ? `<div data-fig="${i}"></div>` : ""}${esc(q.q)}<br><span class="right">✓ ${esc(q.a[0])}</span></div>`).join("") + `</div>` : ""}`;
  document.querySelectorAll("[data-fig]").forEach(slot => {
    const q = r.missed[slot.dataset.fig], part = q.mark || q.find;
    slot.replaceWith(figure(q.img, part ? { [part]: "✓" } : {}, "small"));
  });

  if (left) document.getElementById("again").onclick = begin;
  document.getElementById("share").onclick = () => share(r);
  document.getElementById("home").onclick = home;
  window.scrollTo(0, 0);
}

// ---------- sharing ----------
function wordCard() {
  const w = finishWord();
  return `<div class="card center" style="background:var(--good);color:#fff">
    <div>🏁 Every question right. Your finishing word is</div>
    <div style="font-size:2.2rem;font-weight:800;margin:6px 0">${w ? esc(w.toUpperCase()) : "(no word set yet)"}</div>
    <div>Tell it to whoever set this test.</div></div>`;
}

function share(r) {
  const m = progress(), name = getName();
  const today = new Date().toISOString().slice(0, 10);
  const line = r ? `Round: ${r.right}/${r.answered} (${pct(r.right, r.answered)}%), ${r.score} pts` : "Progress check";
  const core = [name, test.id, today, line, m.done, m.total].join("|");
  const text = `📚 ${name}: ${test.title}\n${line}\nGot right: ${m.done}/${m.total} (${m.p}%) · to fix ${m.wrong}` +
    (state.finished ? "\n🏁 Finished! Word: " + (finishWord() || "?").toUpperCase() : "") + `\n${today} · code ${hash(SALT + core)}`;
  location.href = "https://wa.me/?text=" + encodeURIComponent(text);
}

start();
</script>
</body>
</html>
